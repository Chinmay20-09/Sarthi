<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sarthi | History Log</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            background-color: #090909;
            color: #e5e2e1;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(0, 217, 255, 0.3);
            transform: translateY(-2px);
        }

        .timeline-line {
            background: linear-gradient(180deg, rgba(0, 217, 255, 0) 0%, rgba(0, 217, 255, 0.2) 15%, rgba(0, 217, 255, 0.2) 85%, rgba(0, 217, 255, 0) 100%);
        }

        .glow-cyan {
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.1);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 217, 255, 0.3);
        }
    </style>
    <script id="tailwind-config">

            darkMode: "class",
            theme: {

                        "surface-container-highest": "#353534",
                        "primary": "#afecff",
                        "on-surface-variant": "#bbc9ce",
                        "on-tertiary-fixed-variant": "#6e3900",
                        "on-background": "#e5e2e1",
                        "secondary-fixed": "#e5e2e1",
                        "outline-variant": "#3c494d",
                        "on-secondary-fixed-variant": "#474746",
                        "tertiary": "#ffddc4",
                        "background": "#131313",
                        "surface-container-lowest": "#0e0e0e",
                        "outline": "#859398",
                        "surface-container-low": "#1c1b1b",
                        "on-primary": "#003641",
                        "surface-dim": "#131313",
                        "secondary-container": "#474746",
                        "on-tertiary-fixed": "#2f1500",
                        "error-container": "#93000a",
                        "on-primary-fixed": "#001f26",
                        "inverse-surface": "#e5e2e1",
                        "inverse-on-surface": "#313030",
                        "tertiary-container": "#ffb87f",
                        "on-primary-container": "#005b6c",
                        "on-error": "#690005",
                        "inverse-primary": "#00687b",
                        "primary-container": "#00d9ff",
                        "on-secondary-fixed": "#1c1b1b",
                        "surface-variant": "#353534",
                        "surface-tint": "#00d9ff",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed-dim": "#c8c6c5",
                        "surface": "#131313",
                        "secondary": "#c8c6c5",
                        "on-secondary-container": "#b7b5b4",
                        "tertiary-fixed-dim": "#ffb77d",
                        "surface-bright": "#3a3939",
                        "surface-container-high": "#2a2a2a",
                        "on-tertiary": "#4d2600",
                        "on-secondary": "#313030",
                        "primary-fixed": "#aeecff",
                        "surface-container": "#201f1f",
                        "error": "#ffb4ab",
                        "tertiary-fixed": "#ffdcc3"

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                        "full": "9999px"

                        "margin-mobile": "20px",

                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "data-mono": ["JetBrains Mono"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "data-mono": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],

        }

</head>

<body class="font-body-lg text-body-lg bg-background min-h-screen selection:bg-primary-container/30">
    <!-- Sidebar (loaded from shared component) -->
    <div id="sidebar"></div>
    <!-- Top AppBar Shell -->
    <header
        class="fixed top-0 left-0 md:left-64 right-0 z-30 flex flex-col md:flex-row md:justify-between items-start md:items-center gap-2 px-4 md:px-margin-desktop py-4 bg-transparent backdrop-blur-sm">
        <div class="flex items-center gap-4">
            <h2 class="font-headline-md text-headline-md font-bold text-primary">History Log</h2>
            <div class="px-3 py-1 rounded-full border border-white/10 bg-white/5 flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-primary-container animate-pulse"></span>
                <span id="sync-status" class="font-label-caps text-label-caps text-on-surface-variant">Syncing Stream</span>
            </div>
        </div>
        <div class="flex items-center gap-6">
            <!-- Search Bar -->
            <div class="relative group">
                <span
                    class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">search</span>
                <input id="history-search"
                    class="bg-surface-container-low border border-white/10 rounded-full pl-10 pr-4 py-2 w-full md:w-64 text-sm focus:outline-none focus:ring-1 focus:ring-primary-container transition-all"
                    placeholder="Search interactions..." type="text" />
            </div>
        </div>
    </header>
    <!-- Main Content Canvas -->
    <main class="ml-0 md:ml-64 pt-24 pb-32 px-4 md:px-margin-desktop min-h-screen relative">
        <div class="max-w-4xl mx-auto relative">
            <!-- API error banner -->
            <div id="api-error-banner"
                class="hidden mb-8 p-4 rounded-xl border border-error/30 bg-error/5 text-error font-body-sm"></div>

            <!-- Timeline Vertical Line -->
            <div id="timeline-line" class="absolute left-6 top-8 bottom-0 w-[2px] timeline-line"></div>

            <!-- Live timeline entries grouped by day, rendered by JS -->
            <div id="history-root">
                <div id="history-loading" class="font-label-caps text-label-caps text-on-surface-variant py-8 pl-14">
                    Loading command history…
                </div>
            </div>
        </div>
    </main>
    <!-- Footer (loaded from shared component) -->
    <div id="footer"></div>
    <script src="components.js"></script>
    <script>
        function initializePage() {
            // NOTE: the API origin is the shared `API` constant from components.js
            // (do not redeclare `const API` here — it would throw a redeclaration error).

            const root = document.getElementById("history-root");
            const searchInput = document.getElementById("history-search");
            const statusEl = document.getElementById("sync-status");
            const banner = document.getElementById("api-error-banner");
            let apiOnline = true;

            function showApiError(msg) {
                if (apiOnline) {
                    apiOnline = false;
                    banner.textContent = msg;
                    banner.classList.remove("hidden");
                }
            }
            function hideApiError() {
                if (!apiOnline) {
                    apiOnline = true;
                    banner.classList.add("hidden");
                }
            }

            let allEntries = [];

            function esc(str) {
                const d = document.createElement("div");
                d.textContent = str == null ? "" : String(str);
                return d.innerHTML;
            }

            function fmtTime(ts) {
                const t = new Date(ts);
                if (isNaN(t.getTime())) return "";
                return t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
            }

            function dayKey(ts) {
                const t = new Date(ts);
                if (isNaN(t.getTime())) return "unknown";
                const d = new Date(t.getFullYear(), t.getMonth(), t.getDate());
                return d.toISOString().slice(0, 10);
            }

            function dayLabel(key) {
                const today = dayKey(new Date().toISOString());
                const yesterday = dayKey(new Date(Date.now() - 86400000).toISOString());
                if (key === today) return "Today";
                if (key === yesterday) return "Yesterday";
                const t = new Date(key + "T00:00:00");
                if (isNaN(t.getTime())) return key;
                return t.toLocaleDateString([], { weekday: "short", month: "long", day: "numeric" });
            }

            function dayOfMonth(key) {
                const t = new Date(key + "T00:00:00");
                return isNaN(t.getTime()) ? "•" : String(t.getDate());
            }

            function iconFor(entry) {
                if (entry.action === "open") return "launch";
                if (entry.action === "search") return "search";
                if (entry.action === "remember" || entry.action === "recall") return "psychology";
                if (entry.action === "browse") return "travel_explore";
                if (entry.action === "listen") return "mic";
                if (entry.success) return "bolt";
                return "report";
            }

            function accentFor(entry) {
                if (!entry.success) return { dot: "bg-error", text: "text-error", border: "border-l-error", label: "Failed" };
                return { dot: "bg-primary-container", text: "text-primary-container", border: "border-l-primary-container", label: "Executed" };
            }

            function cardHTML(entry) {
                const a = accentFor(entry);
                const target = entry.target ? " · " + esc(entry.target) : "";
                return `
                <div class="relative group">
                    <div class="absolute -left-[45px] top-4 w-4 h-4 rounded-full ${a.dot} border-4 border-background z-10"></div>
                    <div class="glass-card rounded-2xl p-6 border-l-4 ${a.border}">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-3">
                                <span class="material-symbols-outlined ${a.text}">${iconFor(entry)}</span>
                                <span class="font-label-caps text-xs ${a.text}">${esc(a.label)} · ${esc(entry.action || "unknown")}${target}</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="font-data-mono text-[11px] text-on-surface-variant">${fmtTime(entry.timestamp)}</span>
                                <button data-delete="${entry.id}" title="Delete entry"
                                    class="p-1.5 rounded-full hover:bg-white/10 text-on-surface-variant hover:text-error transition-colors">
                                    <span class="material-symbols-outlined text-sm">delete</span>
                                </button>
                            </div>
                        </div>
                        <h4 class="font-headline-md text-lg mb-2 break-words">"${esc(entry.command)}"</h4>
                    </div>
                </div>`;
            }

            function groupHTML(key, entries) {
                return `
                <div class="mb-16 relative">
                    <div class="flex items-center gap-4 mb-8 sticky top-24 z-10 bg-background/50 backdrop-blur-md py-2">
                        <div class="w-12 h-12 rounded-2xl bg-surface-container-high border border-white/10 flex items-center justify-center shadow-lg">
                            <span class="font-label-caps text-primary text-lg">${dayOfMonth(key)}</span>
                        </div>
                        <div>
                            <h3 class="font-headline-md text-xl font-bold">${esc(dayLabel(key))}</h3>
                        </div>
                    </div>
                    <div class="space-y-8 pl-14">${entries.map(cardHTML).join("")}</div>
                </div>`;
            }

            function emptyHTML(filtered) {
                const msg = filtered
                    ? "No history entries match your search."
                    : "No commands recorded yet. Everything you run through Sarthi will appear here.";
                return `
                <div class="py-16 pl-14">
                    <div class="glass-card rounded-2xl p-8 max-w-xl">
                        <span class="material-symbols-outlined text-primary text-3xl mb-3">history</span>
                        <p class="text-on-surface-variant">${esc(msg)}</p>
                    </div>
                </div>`;
            }

            function render() {
                const q = (searchInput.value || "").trim().toLowerCase();
                const entries = q
                    ? allEntries.filter((e) =>
                        ((e.command || "") + " " + (e.action || "") + " " + (e.target || ""))
                            .toLowerCase()
                            .includes(q))
                    : allEntries;

                const groups = new Map();
                for (const e of entries) {
                    const k = dayKey(e.timestamp);
                    if (!groups.has(k)) groups.set(k, []);
                    groups.get(k).push(e);
                }

                if (!entries.length) {
                    document.getElementById("timeline-line").classList.add("hidden");
                    root.innerHTML = emptyHTML(!!q);
                    return;
                }
                document.getElementById("timeline-line").classList.remove("hidden");
                root.innerHTML = [...groups.entries()].map(([k, list]) => groupHTML(k, list)).join("");
            }

            root.addEventListener("click", async (ev) => {
                const btn = ev.target.closest("[data-delete]");
                if (!btn) return;
                const id = btn.getAttribute("data-delete");
                btn.disabled = true;
                try {
                    const res = await fetch(API + "/command-history/" + encodeURIComponent(id), { method: "DELETE" });
                    const data = await res.json();
                    if (data.success) {
                        allEntries = allEntries.filter((e) => String(e.id) !== String(id));
                        render();
                    } else {
                        btn.disabled = false;
                    }
                } catch {
                    btn.disabled = false;
                }
            });

            searchInput.addEventListener("input", render);

            async function load() {
                statusEl.textContent = "Syncing Stream";
                try {
                    const res = await fetch(API + "/command-history");
                    const data = await res.json();
                    if (!data.success) throw new Error(data.error || "history unavailable");
                    allEntries = data.history || [];
                    hideApiError();
                    statusEl.textContent = allEntries.length + " entries";
                    render();
                } catch (err) {
                    console.warn("[Sarthi History] load failed:", err);
                    allEntries = [];
                    render();
                    showApiError("Could not connect to Sarthi API at " + API + " — is the server running?");
                    statusEl.textContent = "Offline";
                }
            }

            load();
            // Refresh periodically so new commands appear without a reload.
            setInterval(load, 15000);
        }
    </script>
</body>

</html>
