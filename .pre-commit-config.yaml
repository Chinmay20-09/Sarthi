# Pre-commit hooks for Sarthi.
#
# Install once per clone:
#     pip install pre-commit
#     pre-commit install
#
# Run on demand (all files):
#     pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: no-database-files-staged
        name: no database files staged
        description: >-
          Fails the commit if a SQLite file (*.db, *.db-wal, *.db-shm, ...) is
          staged — the database contains personal data and must never be committed.
        entry: python scripts/check_no_db_staged.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-lint
        name: ruff lint
        description: >-
          Runs ruff linter on staged Python files. Catches unused imports,
          syntax errors, and style violations.
        entry: python -m ruff check
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format check
        description: >-
          Checks that Python files are formatted with ruff.
          Does NOT auto-fix — fails the commit so you can review.
        entry: python -m ruff format --check
        language: system
        types: [python]
        stages: [pre-commit]

      - id: smoke-test
        name: Sarthi smoke test
        description: >-
          Quick sanity check: verifies the basic brain pipeline still works
          (entity resolution, app open, filler removal, error handling).
        entry: python main-test.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
