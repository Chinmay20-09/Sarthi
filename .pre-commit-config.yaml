# =============================================================================
# Sarthi — Pre-commit Hooks
# =============================================================================
# Install:  pre-commit install
# Run once: pre-commit run --all-files
# Skip:     SKIP=ruff-lint git commit -m "message"
# =============================================================================

repos:
  # ── Ruff: format + lint ────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff-format
        name: ruff-format
        description: "Check Python formatting with ruff"
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        name: ruff-lint
        description: "Lint Python files with ruff"

  # ── General file hygiene ──────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: trim-trailing-whitespace
        description: "Trim trailing whitespace"
      - id: end-of-file-fixer
        name: fix-end-of-files
        description: "Ensure files end with a newline"
      - id: check-yaml
        name: check-yaml
        description: "Check YAML files for syntax errors"
      - id: check-toml
        name: check-toml
        description: "Check TOML files for syntax errors"

  # ── Mypy: type checking (advisory — not blocking) ─────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: mypy
        description: "Static type checking with mypy"
        args: [--ignore-missing-imports, --follow-imports=skip]
        language: python
        types: [python]
        stages: [manual]  # Run only when explicitly invoked
